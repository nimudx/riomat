name: Windows
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p riomat-core --release
      - run: cargo build -p riomat --release
      - uses: actions/upload-artifact@v4
        with:
          name: riomat-windows
          path: target/release/riomat.exe
