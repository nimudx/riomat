name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Pruebas (los que necesitan datos de referencia se omiten)
        run: cargo test --workspace --release
      - name: Compilar
        run: cargo build -p riomat --release
      - name: Empaquetar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target\release\riomat.exe dist\riomat.exe
          Copy-Item README.md dist\README.md
          Compress-Archive -Path dist\* -DestinationPath riomat-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: riomat-windows
          path: riomat-windows.zip
      - name: Instalador (Inno Setup)
        id: instalador
        continue-on-error: true
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\windows\riomat.iss
      - uses: actions/upload-artifact@v4
        if: steps.instalador.outcome == 'success'
        with:
          name: riomat-instalador
          path: dist/Riomat-Setup-*.exe
      - name: Adjuntar al release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            riomat-windows.zip
            dist/Riomat-Setup-*.exe
