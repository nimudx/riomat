[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
riomat-core = { path = "crates/riomat-core" }
riomat-plot = { path = "crates/riomat-plot" }
gpui-kit = "0.9.1"

[profile.release]
lto = "thin"
codegen-units = 1

# Las dependencias pesadas (render de imágenes, solver) van optimizadas también en debug
[profile.dev.package."*"]
opt-level = 2
[profile.dev.package.riomat-core]
opt-level = 2
[profile.dev.package.riomat-plot]
opt-level = 2
